// build.gradle (Groovy DSL) for legacy Spring MVC WebSocket project with WAR packaging

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'war' // 배포용..
}

group = 'com.chatservice'
version = '1.0.0-BUILD-SNAPSHOT'
description = 'RealTimeChatProgram'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 아래 두 줄 제거 - Spring Boot가 자동으로 관리함
	// implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	// implementation 'org.hibernate:hibernate-core:6.2.2.Final'

	/* spring websocket 의존성 추가 */
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	implementation 'org.json:json:20230227'

	/* spring boot 의 spring mvc 시작 의존성(내장 tomcat 등등) */
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

	/* spring secuiry 관련 의존성 */
	implementation 'org.springframework.boot:spring-boot-starter-security'

	/* rombok 설정 */
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	/* ORACLE DB 연결 위한 JDBC 의존성 추가 */
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'com.oracle.database.jdbc:ojdbc8:19.8.0.0'

	/* 테스트 코드 작성을 위한 Junit 의존성 추가 */
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'

	/* jsp 의존성 추가 */
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:2.0.0'

	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	implementation group: 'org.javassist', name: 'javassist', version: '3.15.0-GA'

	/* redis 의존성 추가 */
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'

	// @Valid 의존성
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// ByteBuddy 의존성 제거 - Spring Boot가 자동으로 관리함
	// implementation 'net.bytebuddy:byte-buddy:1.14.10'

	/* 테스트 관련 의존성 */
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	/* Oracle 테스트 스키마를 쓸 수 없는 환경에서만 쓰는 보조 실행용 DB (-PintegrationDb=h2).
	   H2 결과는 Oracle 검증 결과가 아니다. */
	testRuntimeOnly 'com.h2database:h2'
}

/* build 에 포함되는 단위 테스트. DB·Redis 가 필요한 통합 테스트(@Tag("integration"))는 제외한다. */
tasks.test {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

/*
 * 서비스·API·WebSocket 통합 테스트. 외부 DB 와 Redis 가 필요하므로 build 에 포함하지 않고 직접 실행한다.
 *   Oracle : MARKETPLACE_TEST_DB_URL / _USERNAME / _PASSWORD, MARKETPLACE_TEST_REDIS_PORT 등을 지정한 뒤
 *            ./gradlew integrationTest
 *   H2 보조: ./gradlew integrationTest -PintegrationDb=h2   (Oracle 검증을 대신하지 않는다)
 * JVM 기본 시간대를 Asia/Seoul 로 두어 Instant 저장·조회가 JVM 시간대에 좌우되지 않는지 함께 확인한다.
 */
tasks.register('integrationTest', Test) {
	description = 'DB·Redis 가 필요한 C2C Marketplace 통합 테스트를 실행한다.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter tasks.test
	jvmArgs '-Duser.timezone=Asia/Seoul'
	// DDL 경로(docs/1. 프로젝트개발/...)에 한글이 있어 POSIX 로케일의 리눅스에서는 파일 경로를 해석하지 못한다.
	if (!org.gradle.internal.os.OperatingSystem.current().isWindows() && !(System.getenv('LC_ALL') ?: '').toUpperCase().contains('UTF-8')) {
		environment 'LC_ALL', 'C.UTF-8'
	}
	def profiles = (project.findProperty('integrationDb') == 'h2') ? 'integration,integration-h2' : 'integration'
	systemProperty 'spring.profiles.active', profiles
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

tasks.withType(JavaCompile) {
	options.compilerArgs << '-parameters'
}