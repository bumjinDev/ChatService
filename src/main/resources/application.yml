server:
  port: 8186
  servlet:
    context-path: /ChatService

spring:
  application:
    name: ChatService

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@127.0.0.1:1521:xe
    username: TOYCHAT
    # 비밀번호는 systemd 환경변수에서 주입 (레포에 평문 보관 금지) — Cowork가 systemd 유닛에 ORACLE_PASSWORD 설정
    password: ${ORACLE_PASSWORD}

    hikari:
      auto-commit: false
      idle-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 10000            # 유휴 커넥션 끊김 방지용 주기 신호
      leak-detection-threshold: 60000  # 커넥션 누수 감지 임계값
      maximum-pool-size: 12
      # Direct Buffer Memory 절감: Oracle 네트워크 버퍼를 로컬 OLTP 수준으로 축소
      data-source-properties:
        oracle.net.SDU: 32768            # 32KB
        oracle.net.RECV_BUF_SIZE: 65536  # 64KB
        oracle.net.SEND_BUF_SIZE: 65536  # 64KB

  data:
    redis:
      host: 127.0.0.1   # 배포 미니PC 로컬. 변경 필요 시 외부 IP 입력
      port: 6379
      # 미니PC Redis는 인증이 걸려 있음 — Cowork가 systemd 유닛에 REDIS_PASSWORD 설정
      password: ${REDIS_PASSWORD}
      timeout: 10s
      connect-timeout: 10s
      lettuce:
        pool:
          # Lettuce(Netty)는 커넥션마다 Direct Buffer를 잡으므로 로컬 환경에 맞춰 축소
          max-active: 8
          max-idle: 4
          min-idle: 2
          max-wait: -1ms
          time-between-eviction-runs: 10s

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        default_batch_fetch_size: 50
        jdbc.fetch_size: 100
        cache.use_query_cache: false
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
logging:
  level:
    org:
      springframework:
        web:
          socket: DEBUG
          socket.server: DEBUG
