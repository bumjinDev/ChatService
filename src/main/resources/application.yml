server:
  port: 8186
  servlet:
    context-path: /ChatService

spring:
  application:
    name: ChatService

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 접속 정보와 비밀번호는 환경변수로만 받는다. 예: ORACLE_URL=jdbc:oracle:thin:@127.0.0.1:1521:xe, ORACLE_USERNAME=TOYCHAT
    url: ${ORACLE_URL}
    username: ${ORACLE_USERNAME}
    # 비밀번호는 systemd 환경변수에서 주입 (레포에 평문 보관 금지) — Cowork가 systemd 유닛에 ORACLE_PASSWORD 설정
    password: ${ORACLE_PASSWORD}

    hikari:
      auto-commit: false
      idle-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 10000            # 유휴 커넥션 끊김 방지용 주기 신호
      leak-detection-threshold: 60000  # 커넥션 누수 감지 임계값
      maximum-pool-size: 12
      # Direct Buffer Memory 절감: Oracle 네트워크 버퍼를 로컬 OLTP 수준으로 축소
      data-source-properties:
        oracle.net.SDU: 32768            # 32KB
        oracle.net.RECV_BUF_SIZE: 65536  # 64KB
        oracle.net.SEND_BUF_SIZE: 65536  # 64KB

  data:
    redis:
      # 접속 정보는 환경변수 REDIS_HOST, REDIS_PORT 로 받는다. 값이 없으면 로컬 기본값을 쓴다.
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 미니PC Redis는 인증이 걸려 있음 — Cowork가 systemd 유닛에 REDIS_PASSWORD 설정
      password: ${REDIS_PASSWORD}
      timeout: 10s
      connect-timeout: 10s
      lettuce:
        pool:
          # Lettuce(Netty)는 커넥션마다 Direct Buffer를 잡으므로 로컬 환경에 맞춰 축소
          max-active: 8
          max-idle: 4
          min-idle: 2
          max-wait: -1ms
          time-between-eviction-runs: 10s

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        default_batch_fetch_size: 50
        jdbc.fetch_size: 100
        cache.use_query_cache: false
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        # Instant 를 TIMESTAMP 컬럼에 UTC 기준으로 저장하고 읽는다(설계 명세서 4.3절).
        jdbc.time_zone: UTC
        type.preferred_instant_jdbc_type: TIMESTAMP
    open-in-view: false

  jackson:
    deserialization:
      # 금액 필드에 소수가 들어오면 버리지 않고 입력 오류(400)로 처리한다.
      accept-float-as-int: false

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
# C2C Marketplace 설정
marketplace:
  scheduler:
    # 자동 처리 4종(미발송 자동 취소, 모의 배송 완료, 확인 기간 만료 자동 완료, 무응답 자동 환불)의 실행 여부와 폴링 간격
    enabled: true
    fixed-delay: PT30S
  mock-delivery:
    # 발송 등록 시각부터 모의 배송 완료까지의 기간(ISO-8601 Duration)
    duration: PT2M

logging:
  level:
    org:
      springframework:
        web:
          socket: DEBUG
          socket.server: DEBUG
